name: assemble-upload
on:
  push:
    paths:
      - ".upload-parts/**"
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and commit
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          man = json.loads(pathlib.Path(".upload-parts/manifest.json").read_text())
          for item in man:
              dest = pathlib.Path(item["dest"])
              dest.parent.mkdir(parents=True, exist_ok=True)
              data = b"".join(pathlib.Path(".upload-parts", p).read_bytes() for p in item["parts"])
              if len(data) != item["size"]:
                  raise SystemExit(f"size mismatch {dest}: {len(data)} != {item['size']}")
              dest.write_bytes(data)
              print(dest, len(data))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sites.ts src/hub.client.js test/api.spec.ts
          git diff --cached --quiet || git commit -m "Add remaining Worker sources and tests."
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Add package-lock.json."
          rm -rf .upload-parts .github/workflows/assemble-upload.yml
          git add -A
          git diff --cached --quiet || git commit -m "Remove upload assembly parts."
          git push
