name: Release Please

on:
  push:
    branches: [main]

# Canonical repo only. Forks that copy this file must not open Release PRs
# or mint tags on their own default branch.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    if: github.repository == 'tmchow/energon'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A GITHUB_TOKEN-opened Release PR leaves its required checks waiting for manual approval.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
