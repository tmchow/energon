name: Release Please

on:
  push:
    branches: [main]

# Canonical repo only. Forks that copy this file must not open Release PRs
# or mint tags on their own default branch.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    if: github.repository == 'tmchow/energon'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
