name: Release Please

on:
  push:
    branches: [main]

# Canonical repo only. Forks that copy this file must not open Release PRs
# or mint tags on their own default branch.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    if: github.repository == 'tmchow/energon'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
