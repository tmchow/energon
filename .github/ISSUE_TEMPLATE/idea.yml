name: Idea
description: A change you want. Open this before a large PR.
title: "[idea] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem. Open an issue first for behavior, schema, or `/v1` changes; a PR can follow once the idea is accepted.
        See [CONTRIBUTING.md](https://github.com/tmchow/energon/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or wrong today if this does not exist.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: Optional. A sketch is enough. A PR that implements this should wait until the idea is accepted.
    validations:
      required: false
