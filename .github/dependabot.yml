# pele and mermaid are vendored into public/static and run in readers' browsers. They stay ungrouped
# so each bump gets its own PR; check diagrams in a browser before merging (CI proves the files load, not how they draw).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    open-pull-requests-limit: 5
    groups:
      runtime:
        dependency-type: production
        exclude-patterns:
          - pele
          - mermaid
        update-types:
          - minor
          - patch
      tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"
