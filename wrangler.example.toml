# Copy over wrangler.toml after `wrangler d1 create` / `wrangler r2 bucket create`.
# Do not reuse another Energon's database_id or bucket. See INSTALL.md and docs/DEPLOY.md.

name = "energon"
main = "src/index.ts"
compatibility_date = "2026-08-26"
workers_dev = true

# [[routes]]
# pattern = "energon.example.com"
# custom_domain = true
# [[routes]]
# pattern = "content.energon.example.com"
# custom_domain = true

[vars]
PUBLIC_ORIGIN = "https://energon.example.com"
CONTENT_ORIGIN = "https://content.energon.example.com"
TOKEN_ENV = "ENERGON_TOKEN"
SKILL_NAME = "energon"
MARKETPLACE_NAME = "energon"
MARKETPLACE_REPO = "your-org/energon"

# Company (trusted org) — matches the committed wrangler.toml:
ALLOW_UNLIMITED_RETENTION = "true"
DEFAULT_TTL = "never"
MAX_TTL = "never"
WRITE_POLICY = "org"
# API tokens: humans pick 1d..365d at mint (default 90d). "true" also offers Never.
# Only affects future mints; tokens already minted keep working until revoked on /tokens.
ALLOW_UNLIMITED_TOKENS = "true"
# ALLOWED_EMAIL_DOMAINS = "example.com"
# Optional line on signed-in pages. Omit or leave empty for no footer.
# FOOTER_TEXT = "Internal — not for the public internet."
# Single-file cap. Omit for 100 MB. Cloudflare Free and Pro plans reject request bodies over 100 MB.
# MAX_FILE_BYTES = "100mb"
# ZIP imports are staged and extracted incrementally; each entry still obeys MAX_FILE_BYTES.
# Defaults: 100 MiB compressed input, 500 MiB expanded contents, 25 MiB buffered export.
# MAX_ZIP_IMPORT_BYTES = "100mb"
# MAX_ZIP_EXTRACTED_BYTES = "500mb"
# MAX_ZIP_EXPORT_BYTES = "25mb"
# An explicit legacy MAX_ZIP_BYTES supplies the fallback for unset ZIP limits.
# Large ZIPs require the qualified Workers Paid profile; see docs/atomic-site-deployments.md.
# Instance-wide quota includes staged and retained bytes. Omit for 20 GiB.
# MAX_PLATFORM_BYTES = "20gb"
# Enable only after full bridge rollout and old-writer/cache drain; see docs/DEPLOY.md.
# SITE_VERSIONING_ENABLED = "true"

# Stricter / untrusted host — use instead of the block above:
# ALLOW_UNLIMITED_RETENTION = "false"
# DEFAULT_TTL = "7d"
# MAX_TTL = "30d"
# WRITE_POLICY = "owner"
# ALLOW_UNLIMITED_TOKENS = "false"
# ALLOWED_EMAIL_DOMAINS = ""

[triggers]
crons = ["*/5 * * * *"]

[cache]
enabled = true
cross_version_cache = false

[[d1_databases]]
binding = "DB"
database_name = "energon"
database_id = "PASTE_FROM_WRANGLER_D1_CREATE"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "energon"

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.svg", "**/*.css", "**/*.client.js", "**/*.txt"]
fallthrough = false
